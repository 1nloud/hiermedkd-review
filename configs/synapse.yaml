# Synapse multi-organ CT dataset configuration

# Inherits from base.yaml
_base_: "base.yaml"

# Dataset-specific settings
data:
  dataset_name: "synapse"
  data_dir: "datasets/synapse"
  in_channels: 1
  num_classes: 8  # 8 organs: aorta, gallbladder, L/R kidney, liver, pancreas, spleen, stomach
  ignore_label: 255
  horizontal_flip_probability: 0.0
  
  # Split configuration: 14/4/12 from 30 released labeled cases
  split:
    train: 14
    val: 4
    test: 12
    seed: 2027
    
# Model settings
model:
  student:
    in_channels: 1
    num_classes: 8
    
# Training settings
training:
  batch_size: 8
  num_epochs: 300
  
# Evaluation
evaluation:
  nsd_tolerance: 1.0  # mm for volumetric CT

# Preprocessing (as per paper):
# - HU clipped to [-125, 275] then normalized to [0, 1]
# - No flips to preserve kidney laterality
# - Bilinear/nearest resizing to 224x224
# - No other geometric augmentations
